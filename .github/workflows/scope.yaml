name: Scope
# Report-only (contract T12 interim state): classifies each pull request from
# contract/scopes.config.ts, applies labels, and posts one verdict comment. Never blocks.
# All logic lives in contract/scripts/scope-pr.ts.
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  pull-requests: write
jobs:
  classify:
    name: Classify the change
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Classify and report
        if: hashFiles('contract/scripts/scope-pr.ts') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node --no-warnings contract/scripts/scope-pr.ts
